[project]
name = "eos"
version = "1.10.0"
description = "Multi-tenant SaaS for real estate photography studios — Aryeo-class alternative"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["eos", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "F841"]

[tool.coverage.run]
source = ["eos"]
omit = ["eos/migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
# Scoped ratchet: only money/security-adjacent core modules gate CI today.
# TODO: widen `files` module-by-module (routes/ and the Stripe/webhook layers
# are the worst offenders) until the whole eos/ package type-checks.
files = [
    "eos/db.py",
    "eos/vocab.py",
    "eos/tenant.py",
    "eos/usage.py",
    "eos/plan_limits.py",
    "eos/billing_gate.py",
    "eos/paywall.py",
    "eos/payments.py",
    "eos/photographer_pay.py",
    "eos/stripe_connect.py",
    "eos/scheduler.py",
]

[tool.bandit]
# Dynamic UPDATE/IN clauses use code-controlled columns + bound params.
skips = ["B608"]