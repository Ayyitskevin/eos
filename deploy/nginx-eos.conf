# Reverse proxy for Eos — place in /etc/nginx/sites-available/eos.
# Before enabling, use your DNS provider's ACME DNS-01 plugin to provision one
# certificate containing BOTH eos.example.com and *.eos.example.com. Replace
# the domain and certificate paths below; never rely on HTTP-01 for a wildcard.

upstream eos_app {
    server 127.0.0.1:8410;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Do not reflect an unrecognized Host into a redirect.
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name eos.example.com *.eos.example.com;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eos.example.com *.eos.example.com;

    ssl_certificate /etc/letsencrypt/live/eos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eos.example.com/privkey.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://eos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Eos trusts this dedicated header only from a loopback proxy peer.
        # proxy_set_header overwrites any client-supplied value.
        proxy_set_header X-Eos-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
